<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sri Sai Jewellers</title>

    <!-- Luxury Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: 'Montserrat', sans-serif;

            background: #032D21;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            color: #D8B65A;

        }


        .container {

            background: #082F25;

            width: 320px;

            padding: 30px;

            border-radius: 15px;

            text-align: center;

            border: 1px solid rgba(216, 182, 90, 0.45);

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.35),
                inset 0 0 25px rgba(216, 182, 90, 0.03);

        }


        /* Logo */

        .logo {

            width: 170px;

            max-width: 100%;

            height: auto;

            margin: 0 auto 15px auto;

            display: block;

        }


        h1 {

            margin: 10px 0;

            font-family: 'Cormorant Garamond', serif;

            font-size: 42px;

            font-weight: 500;

            letter-spacing: 2px;

            color: #D8B65A;

        }


        .description {

            margin-top: 5px;

            color: #C9C4B5;

            font-family: 'Montserrat', sans-serif;

            font-size: 13px;

            letter-spacing: 2px;

            text-transform: uppercase;

        }


        #number {

            font-family: 'Cormorant Garamond', serif;

            font-size: 70px;

            font-weight: 500;

            margin: 25px 0;

            color: #E3C66A;

            letter-spacing: 1px;

        }


        #qrCode {

            width: 250px;

            height: 250px;

            display: none;

            margin: 20px auto;

            border-radius: 5px;

        }


        button {

            width: 100%;

            background: linear-gradient(
                90deg,
                #D9A94A,
                #F1D48A,
                #D9A94A
            );

            color: #073025;

            border: none;

            padding: 15px 25px;

            font-family: 'Montserrat', sans-serif;

            font-size: 14px;

            font-weight: 700;

            letter-spacing: 2px;

            border-radius: 30px;

            cursor: pointer;

            box-shadow:
                0 5px 18px rgba(216, 182, 90, 0.25);

            transition: all 0.3s ease;

        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 25px rgba(216, 182, 90, 0.4);

        }


        button:disabled {

            background: #777;

            color: white;

            cursor: not-allowed;

            opacity: 0.8;

            transform: none;

        }


        /* Small luxury line */

        .container::before {

            content: "";

            display: block;

            width: 70px;

            height: 1px;

            background: #D8B65A;

            margin: 0 auto 20px auto;

            opacity: 0.7;

        }
.instagram-link {
    display: inline-block;
    margin-top: 20px;
    margin-bottom: 5px;

    color: #D8B65A;

    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 600;

    letter-spacing: 1.5px;

    text-decoration: none;

    transition: all 0.3s ease;
}

.instagram-link:hover {
    color: #F1D48A;
    transform: translateY(-1px);
}

    </style>

</head>


<body>


    <div class="container">


        <img
            src="images/saijewels.jpeg"
            alt="Srisai Jewellers Logo"
            class="logo"
        >


        <h1>Sri Sai Jewellers</h1>


        <p class="description">
            A Special Offer For You
        </p>
        <a
            href="https://www.instagram.com/srisai_jewellers_offical/"
            target="_blank"
            rel="noopener noreferrer"
            class="instagram-link"
        >
            📷 Follow us on Instagram
        </a>

        <div id="number">
            ?
        </div>


        <img
            id="qrCode"
            alt="QR Code"
        >


        <button
            id="generateButton"
            onclick="generateQR()"
        >
            MY OFFER
        </button>


    </div>


    <script>

        const numberElement =
            document.getElementById("number");

        const qrCode =
            document.getElementById("qrCode");

        const generateButton =
            document.getElementById("generateButton");


        // Check if this browser already generated a number

        const savedNumber =
            localStorage.getItem("SrisaiGeneratedNumber");


        // If a number already exists

        if (savedNumber !== null) {

            showQR(savedNumber);

            generateButton.disabled = true;

            generateButton.textContent =
                "QR ALREADY GENERATED";

        }


        function generateQR() {

            // Prevent generating again

            if (
                localStorage.getItem("SrisaiGeneratedNumber")
                !== null
            ) {

                return;

            }


            // Generate random number from 5 to 20

            const randomNumber =
                Math.floor(Math.random() * 16) + 5;


            // Save number in this browser

            localStorage.setItem(
                "SrisaiGeneratedNumber",
                randomNumber
            );


            // Show QR

            showQR(randomNumber);


            // Disable button

            generateButton.disabled = true;

            generateButton.textContent =
                "QR ALREADY GENERATED";

        }


        function showQR(number) {

            // Show number

            numberElement.textContent =
                number + "% on VA";


            // Create QR code

            const qrUrl =
                "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data="
                + encodeURIComponent(number);


            // Show QR

            qrCode.src = qrUrl;

            qrCode.style.display = "block";

        }

    </script>


</body>

</html>
